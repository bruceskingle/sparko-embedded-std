[package]
name = "sparko-embedded-std"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
anyhow = "1.0.102"
chrono = "0.4.44"
croner = "3.0.1"
indexmap = "2.13.0"
heapless = "0.9.1"
embedded-graphics = "0.8"
rgb = "0.8.53"
serde_json = "1"
# The mDNS responder, see mdns.rs.
simple-dns = "0.11.2"
# The attitude and tilt, see ahrs.rs, with the ahrs and tilt features.
ahrs = { version = "0.8.0", features = ["field_access"], optional = true }
nalgebra = { version = "0.34.2", optional = true }

feature-config-derive = { path = "../feature-config-derive"}

[features]
# The attitude and heading from an IMU's readings, see ahrs.rs.
ahrs = ["dep:ahrs", "dep:nalgebra"]
# The tilt from an IMU's readings, see ahrs.rs.
tilt = ["dep:ahrs", "dep:nalgebra"]

[dev-dependencies]
env_logger = "0.11.10"

[package]
name = "bruce-embedded-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "The firmware for bruce-embedded-std boards on a computer: the shared folder it is kept in, by repository and version, and downloading it from GitHub releases."

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
